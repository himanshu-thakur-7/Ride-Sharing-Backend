version: "3.8"

services:
  redis:
    image: redis:7
    container_name: ride-sharing-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]

  localstack:
    image: localstack/localstack:latest
    container_name: ride-sharing-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,sqs
      - DEBUG=1
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - localstack_data:/var/lib/localstack
    restart: unless-stopped

  aws-init:
    image: amazon/aws-cli
    container_name: ride-sharing-aws-init
    depends_on:
      - localstack
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for LocalStack...';
      sleep 5;

      echo 'Creating DynamoDB table: rides';
      aws --endpoint-url=http://localstack:4566 dynamodb create-table \
        --table-name rides \
        --attribute-definitions AttributeName=ride_id,AttributeType=S \
        --key-schema AttributeName=ride_id,KeyType=HASH \
        --billing-mode PAY_PER_REQUEST || true;

      echo 'Creating SQS queues';
      aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name MATCH_RIDE || true;
      aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name CHECK_TIMEOUT || true;

      echo 'Setup complete!';
      "

volumes:
  localstack_data: